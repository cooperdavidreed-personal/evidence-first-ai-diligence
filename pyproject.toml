[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ic-evidence-lab"
version = "0.2.0"
description = "Evidence-linked synthetic PE and VC underwriting decision workspace"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Cooper Reed"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "jsonschema[format]==4.26.0",
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
]

[project.urls]
Homepage = "https://underwriting-desk-delta.vercel.app/"
Repository = "https://github.com/cooperdavidreed-personal/evidence-first-ai-diligence"
Issues = "https://github.com/cooperdavidreed-personal/evidence-first-ai-diligence/issues"

[project.optional-dependencies]
toolkit = [
  "dailyaiagents-evidence-gate==0.1.1",
  "dailyaiagents-release-gate==0.1.1",
  "mcp==1.29.1",
]
dev = ["pytest==9.1.1", "Pillow==12.3.0"]
demo = ["Pillow==12.3.0"]
quality = ["bandit==1.8.6", "pip-audit==2.9.0", "ruff==0.12.12"]

[project.scripts]
ic-evidence-lab = "ic_evidence_lab.cli:main"
underwriting-lab = "underwriting_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_evidence_lab", "src/underwriting_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
