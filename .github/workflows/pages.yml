name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'output/pdf/**'
      - 'portfolio/**'
      - 'pyproject.toml'
      - 'scripts/build_pages.py'
      - 'src/**'
      - 'uv.lock'
      - 'verification/visual-evidence.json'
      - 'verification/accessibility-evidence/**'
      - 'workbench/**'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.21
      - run: npm install --global pnpm@11.19.0
      - run: uv sync --locked --extra dev
      - run: pnpm --dir workbench install --frozen-lockfile
      - run: pnpm --dir workbench build
      - run: uv run pytest tests/test_pages.py
      - run: uv run python scripts/scan_public.py
      - run: uv run python scripts/build_pages.py --out dist/pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
