name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install uv==0.11.21
      - run: uv sync --locked --extra dev
      - run: uv run bash scripts/verify-all.sh

  toolkit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install uv==0.11.21
      - run: uv sync --locked --extra dev --extra toolkit
      - run: uv run pytest tests/test_toolkit_adapter.py

  demo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install uv==0.11.21
      - run: uv sync --locked --extra dev --extra demo
      - run: uv run python scripts/render_demo.py --out dist/demo
      - run: uv run python scripts/verify_demo.py --root dist/demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-demo
          path: |
            dist/demo/evidence-first-ai-diligence-demo.mp4
            dist/demo/captions.srt
            dist/demo/captions.vtt
            dist/demo/manifest.json

  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install uv==0.11.21
      - run: uv sync --locked --extra quality
      - run: uv run bash scripts/verify-security.sh
